name: expert-builder-evaluation-controller
description: Runs deterministic expert-builder leaf and folder evaluation cases.

base:
  image: ubuntu:24.04
  config:
    security.nesting: "false"
    limits.cpu: "2"
    limits.memory: 4GiB

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl python3 python3-venv
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - uv tool install git+https://github.com/microsoft/amplifier-bundle-attractor@6e3ce62f617e9f8d15aeac5966a2711c31b943b1#subdirectory=modules/pipeline-runner
    - mkdir -p /opt/evaluation

readiness:
  - name: python
    command: "python3 --version"
  - name: git
    command: "git --version"
  - name: attractor
    command: "attractor run --help >/dev/null"