name: Package test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  expert-builder-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -m 'not remote'
      - run: uv run pytest -q -m remote
        env:
          PIPELINES_REMOTE_SHA: ${{ github.sha }}